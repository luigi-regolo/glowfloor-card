<!doctype html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>GlowFloor Card — Anteprima interattiva</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; padding: 28px 14px 24px; font-family: Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: #0c141a; color: #a4b4be; transition: background .25s ease, color .25s ease; }
    main { max-width: 1024px; margin: 0 auto; }
    glowfloor-card { display: block; }
    .demo-note { margin: 13px 8px 0; text-align: center; font-size: 11px; line-height: 1.5; color: #9caeb7; }
    body.light { background: #edf1f2; color: #52646d; }
    body.light .demo-note { color: #60737c; }
    @media (max-width: 520px) { body { padding: 10px 6px 18px; } .demo-note { font-size: 10px; } }
  </style>
</head>
<body>
  <main>
    <glowfloor-card></glowfloor-card>
    <p class="demo-note">Anteprima interattiva: gli stati delle luci e le scene sono simulati.</p>
  </main>
  <script src="../dist/glowfloor-card.js"></script>
  <script>
    const ids = ['light.living_room', 'light.kitchen', 'light.bedroom', 'light.bathroom'];
    const states = Object.fromEntries(ids.map((entity, index) => [entity, {state: 'off', attributes: {
      brightness: [220, 190, 145, 255][index],
      rgb_color: [[255, 186, 95], [255, 235, 171], [130, 170, 255], [255, 194, 116]][index]
    }}]));
    const card = document.querySelector('glowfloor-card');
    const hass = {
      states,
      themes: {darkMode: true},
      async callService(domain, service, data) {
        if (domain === 'light') {
          const items = Array.isArray(data.entity_id) ? data.entity_id : [data.entity_id];
          items.forEach(entity => {
            if (!states[entity]) return;
            states[entity].state = service === 'toggle' ? (states[entity].state === 'on' ? 'off' : 'on') : (service === 'turn_off' ? 'off' : 'on');
          });
          card.hass = {...hass, states: {...states}};
        } else {
          alert('Scena simulata: ' + data.entity_id);
        }
      }
    };
    card.setConfig({
      title: 'Living spaces',
      subtitle: 'A beautiful way to see your home come alive.',
      theme_mode: 'auto',
      spill_enabled: true,
      lights: [
        {entity: ids[0], name: 'Living', x: 27, y: 44, spread: 36},
        {entity: ids[1], name: 'Kitchen', x: 75, y: 29, spread: 28},
        {entity: ids[2], name: 'Bedroom', x: 58.5, y: 75, spread: 32},
        {entity: ids[3], name: 'Bath', x: 81.5, y: 76, spread: 24}
      ],
      scenes: [
        {entity: 'scene.relax', name: 'Relax'},
        {entity: 'scene.movie', name: 'Movie'},
        {entity: 'scene.night', name: 'Night'}
      ]
    });
    card.hass = hass;
    card.addEventListener('hass-more-info', ev => alert('Dettagli entità: ' + ev.detail.entityId));
    const observer = new MutationObserver(() => document.body.classList.toggle('light', card.dataset.theme === 'light'));
    observer.observe(card, {attributes: true, attributeFilter: ['data-theme']});
  </script>
</body>
</html>
